<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F2">
<title>No Excuses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF7F2; --ink: #1A1A1A; --muted: #6B6560; --line: #E6E0D8;
    --card: #FFFFFF; --red: #D7392B; --red-soft: #FBE9E7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  main { max-width: 440px; margin: 0 auto; padding: 20px 16px 40px; min-height: 100vh; }
  h1 { font-size: 28px; font-weight: 800; margin: 8px 0 4px; letter-spacing: -0.02em; }
  h2 { font-size: 20px; font-weight: 800; margin: 0 0 12px; }
  p { line-height: 1.45; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .topline { font-size: 14px; font-weight: 600; color: var(--muted); margin: 0 0 16px; }
  .brand { font-weight: 800; letter-spacing: -0.02em; font-size: 18px; }
  button { font: inherit; cursor: pointer; border: 0; }
  .btn { display: block; width: 100%; padding: 16px; border-radius: 14px; font-size: 18px; font-weight: 800; }
  .btn-red { background: var(--red); color: #fff; }
  .btn-ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
  .btn:disabled { opacity: .35; cursor: default; }
  .link { background: none; color: var(--ink); text-decoration: underline; padding: 8px 0; font-size: 15px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 12px; }
  .card.over { background: var(--red-soft); border-color: var(--red); }
  .card .label { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .card .big { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin: 6px 0 2px; color: var(--red); }
  .card .big.ink { color: var(--ink); }
  .card .sub { font-size: 16px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 8px; }
  .links { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  select { width: 100%; font: inherit; font-size: 18px; padding: 14px; border-radius: 12px; border: 2px solid var(--ink); background: #fff; margin: 12px 0 16px; }
  .amount { font-size: 56px; font-weight: 800; text-align: center; margin: 12px 0 4px; letter-spacing: -0.03em; }
  .preview { text-align: center; min-height: 22px; font-weight: 600; color: var(--red); margin-bottom: 12px; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .keypad button { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 0; font-size: 24px; font-weight: 600; }
  .keypad button:active { background: var(--line); }
  .actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
  .list { list-style: none; padding: 0; margin: 0 0 20px; }
  .list li { display: flex; justify-content: space-between; padding: 14px 4px; border-bottom: 1px solid var(--line); }
  .list li.tap { cursor: pointer; }
  .list li.skip { color: var(--muted); font-style: italic; }
  .modal-wrap { position: fixed; inset: 0; background: rgba(26,26,26,.5); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: var(--bg); border-radius: 18px; padding: 22px; max-width: 400px; width: 100%; }
  .modal p { margin: 6px 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main id="app"></main>
<div id="modal" class="modal-wrap hidden"><div class="modal" id="modal-body"></div></div>

<script src="logic.js"></script>
<script>
(function () {
  var NE = window.NoExcuses;
  var KEY = 'noexcuses-v1';
  var app = document.getElementById('app');
  var LABEL = { pizza: 'Pizza', cash: 'Cash' };
  var UNIT = { pizza: ['pizza trip', 'pizza trips'], cash: ['cash purchase', 'cash purchases'] };

  // ---- storage (phone browser only) ----
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; }
  }
  function save(s) {
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { alert('Could not save. Is private browsing on?'); }
  }
  var state = load();

  // ---- helpers ----
  function money(n) { return '$' + (Math.round(n * 100) / 100).toFixed(2).replace(/\.00$/, ''); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function day(ts) { return new Date(ts).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); }
  function dayTime(ts) { return new Date(ts).toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' }); }
  function trips(cat, n) { return n + ' ' + UNIT[cat][n === 1 ? 0 : 1] + ' left'; }

  function showModal(html) {
    document.getElementById('modal-body').innerHTML = html;
    document.getElementById('modal').classList.remove('hidden');
  }
  function hideModal() { document.getElementById('modal').classList.add('hidden'); }

  // ---- screens ----
  var screen = 'home', logCat = null, amountStr = '';

  function render() {
    if (!state) return renderSetup();
    if (screen === 'log') return renderLog();
    if (screen === 'history') return renderHistory();
    renderHome();
  }

  // 1. Setup (first open only)
  function renderSetup() {
    var opts = NE.mondayOptions(Date.now()).map(function (ts) {
      return '<option value="' + ts + '">Monday, ' + day(ts).replace(/^\w+,?\s*/, '') + ' · 8:00 AM</option>';
    }).join('');
    app.innerHTML =
      '<div class="brand">No Excuses</div>' +
      '<h1>When does block 1 start?</h1>' +
      '<p class="muted">Block 1 is four weeks of logging only, with no limits. It sets your starting number. Weeks run Monday 8 AM to Monday 8 AM.</p>' +
      '<select id="start">' + opts + '</select>' +
      '<button class="btn btn-red" id="go">Start</button>';
    document.getElementById('go').onclick = function () {
      state = { startTs: Number(document.getElementById('start').value), purchases: [], skips: [], seenReport: 1 };
      save(state); screen = 'home'; render();
    };
  }

  // 2. Home
  function renderHome() {
    var now = Date.now();
    var r = NE.compute(state, now);

    if (!r.started) {
      app.innerHTML =
        '<div class="brand">No Excuses</div>' +
        '<h1>Starts ' + day(state.startTs) + ', 8 AM</h1>' +
        '<p class="muted">Tracking begins then. Come back and log every pizza run and cash purchase.</p>';
      return;
    }

    var top = 'Block ' + r.block + ' · ' +
      (r.skipped ? 'Skipped week' : 'Week ' + r.week.weekInBlock + ' of 4') +
      (r.pct === null ? ' · Measuring, no limits yet' : ' · Limit ' + r.pct + '%');

    var body;
    if (r.skipped) {
      body = '<div class="card"><div class="big ink">Skipped week</div><div class="sub muted">Back ' + day(r.weekEnd) + ', 8 AM</div></div>';
    } else {
      body = NE.CATS.map(function (c) {
        var i = r.cats[c];
        if (r.pct === null) {
          return '<div class="card"><div class="label">' + LABEL[c] + '</div>' +
            '<div class="big ink">' + money(i.spentWeek) + '</div>' +
            '<div class="sub">spent this week</div>' +
            '<div class="sub muted small">' + money(i.spentBlock) + ' spent this block</div></div>';
        }
        var over = i.over > 0;
        var big = i.tripsLeft === null ? money(Math.max(0, i.left)) + ' left' : trips(c, i.tripsLeft);
        return '<div class="card' + (over ? ' over' : '') + '"><div class="label">' + LABEL[c] + '</div>' +
          '<div class="big">' + big + '</div>' +
          '<div class="sub">' + (over ? 'Over by ' + money(i.over) : money(i.left) + ' of ' + money(i.limit) + ' left') + '</div></div>';
      }).join('');
    }

    var buttons = r.skipped ? '' :
      '<div class="row"><button class="btn btn-red" data-log="pizza">+ Pizza</button>' +
      '<button class="btn btn-red" data-log="cash">+ Cash</button></div>';

    var skipBit = '';
    if (r.skipped) skipBit = '<button class="link" id="undo">Undo skip</button>';
    else if (r.canSkip) skipBit = '<span><button class="link" id="skip">Skip this week</button><br><span class="small muted">1 skip left this block</span></span>';
    else if (r.skipUsedThisBlock) skipBit = '<span class="small muted">Skip used this block</span>';

    app.innerHTML =
      '<div class="brand">No Excuses</div>' +
      '<p class="topline">' + top + '</p>' + body + buttons +
      '<div class="links"><button class="link" id="hist">History</button>' + skipBit + '</div>';

    app.querySelectorAll('[data-log]').forEach(function (b) {
      b.onclick = function () { logCat = b.getAttribute('data-log'); amountStr = ''; screen = 'log'; render(); };
    });
    document.getElementById('hist').onclick = function () { screen = 'history'; render(); };
    var sk = document.getElementById('skip');
    if (sk) sk.onclick = function () {
      showModal('<h2>Skip this week?</h2><p>Nothing is tracked until Monday 8 AM, and this week won\'t count toward your block.</p>' +
        '<div class="actions" style="margin-top:16px"><button class="btn btn-ghost" id="m-no">Cancel</button><button class="btn btn-red" id="m-yes">Skip</button></div>');
      document.getElementById('m-no').onclick = hideModal;
      document.getElementById('m-yes').onclick = function () { state.skips.push(r.weekStart); save(state); hideModal(); render(); };
    };
    var un = document.getElementById('undo');
    if (un) un.onclick = function () {
      state.skips = state.skips.filter(function (t) { return t !== r.weekStart; }); save(state); render();
    };

    // Block-end message, shown once per block.
    if (r.report && (state.seenReport || 1) < r.block) showReport(r);
  }

  function showReport(r) {
    var rep = r.report, lines;
    if (rep.block === 1) {
      lines = '<p><b>Block 1 done.</b> Your starting numbers:</p>' +
        NE.CATS.map(function (c) { return '<p>' + LABEL[c] + ': ' + money(rep.cats[c].total) + '</p>'; }).join('');
    } else {
      lines = NE.CATS.map(function (c) {
        var x = rep.cats[c];
        return '<p>' + LABEL[c] + ': ' + (x.hit ? 'hit it.' : 'missed by ' + money(x.missedBy) + '.') + '</p>';
      }).join('');
      if (rep.finalCheck) lines = '<p><b>' + (NE.CATS.every(function (c) { return rep.cats[c].hit; }) ? 'Goal check: at or under 50%.' : 'Goal check: not at 50% yet.') + '</b></p>' + lines;
    }
    showModal('<h2>Block ' + rep.block + ' is over</h2>' + lines +
      '<p><b>New limit: ' + rep.newPct + '%.</b></p>' +
      '<button class="btn btn-red" id="m-ok" style="margin-top:16px">OK</button>');
    document.getElementById('m-ok').onclick = function () { state.seenReport = r.block; save(state); hideModal(); };
  }

  // 3. Log Purchase
  function renderLog() {
    var r = NE.compute(state, Date.now());
    var amt = parseFloat(amountStr) || 0;
    var preview = '';
    if (r.started && r.pct !== null && amt > 0) {
      var i = r.cats[logCat];
      var left = i.left - amt;
      var n = i.avg > 0 ? NE.tripsLeft(left, i.avg) : NE.tripsLeft(left, amt);
      preview = left < 0 ? 'After this: over by ' + money(-left) + ' this week' : 'After this: ' + trips(logCat, n) + ' this week';
    }
    var keys = ['1','2','3','4','5','6','7','8','9','.','0','⌫'];
    app.innerHTML =
      '<div class="brand">No Excuses</div>' +
      '<h1>' + LABEL[logCat] + '</h1>' +
      '<div class="amount">$' + esc(amountStr || '0') + '</div>' +
      '<div class="preview">' + esc(preview) + '</div>' +
      '<div class="keypad">' + keys.map(function (k) { return '<button data-k="' + k + '">' + k + '</button>'; }).join('') + '</div>' +
      '<div class="actions"><button class="btn btn-ghost" id="cancel">Cancel</button>' +
      '<button class="btn btn-red" id="save"' + (amt > 0 ? '' : ' disabled') + '>Save</button></div>';

    app.querySelectorAll('[data-k]').forEach(function (b) {
      b.onclick = function () {
        var k = b.getAttribute('data-k');
        if (k === '⌫') amountStr = amountStr.slice(0, -1);
        else if (k === '.') { if (amountStr.indexOf('.') === -1) amountStr = (amountStr || '0') + '.'; }
        else {
          var dot = amountStr.indexOf('.');
          if (dot !== -1 && amountStr.length - dot > 2) return;   // max 2 decimals
          if (amountStr.replace('.', '').length >= 6) return;      // max $9999.99
          amountStr = amountStr === '0' ? k : amountStr + k;
        }
        render();
      };
    });
    document.getElementById('cancel').onclick = function () { screen = 'home'; render(); };
    document.getElementById('save').onclick = function () {
      var a = Math.round((parseFloat(amountStr) || 0) * 100) / 100;
      if (!(a > 0)) return;
      state.purchases.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), cat: logCat, amount: a, ts: Date.now() });
      save(state); screen = 'home'; render();
    };
  }

  // 4. History
  function renderHistory() {
    var now = Date.now();
    var r = NE.compute(state, now);
    var week = !r.started ? [] : state.purchases.filter(function (p) { return p.ts >= r.weekStart && p.ts < r.weekEnd; })
      .sort(function (a, b) { return b.ts - a.ts; });

    var items = week.length ? week.map(function (p) {
      return '<li class="tap" data-id="' + esc(p.id) + '"><span><b>' + LABEL[p.cat] + '</b> · ' + dayTime(p.ts) + '</span><span>' + money(p.amount) + '</span></li>';
    }).join('') : '<li class="muted">Nothing logged this week.</li>';

    var totals = !r.started ? '' : NE.CATS.map(function (c) {
      var i = r.cats[c];
      return '<li><span>' + LABEL[c] + '</span><span>' + money(i.spentBlock) +
        (r.pct !== null ? ' of ' + money(i.blockTarget) + ' target' : '') + '</span></li>';
    }).join('');

    var skipped = (state.skips || []).slice().sort().map(function (t) {
      return '<li class="skip"><span>Week of ' + day(t) + '</span><span>Skipped</span></li>';
    }).join('');

    app.innerHTML =
      '<div class="brand">No Excuses</div>' +
      '<h1>History</h1>' +
      '<p class="small muted">This week. Tap a purchase to delete it.</p>' +
      '<ul class="list">' + items + '</ul>' +
      (r.started ? '<h2>Block ' + r.block + ' totals</h2><ul class="list">' + totals + '</ul>' : '') +
      (skipped ? '<h2>Skipped weeks</h2><ul class="list">' + skipped + '</ul>' : '') +
      '<button class="btn btn-ghost" id="back">Back</button>';

    app.querySelectorAll('[data-id]').forEach(function (li) {
      li.onclick = function () {
        if (!confirm('Delete this purchase?')) return;
        var id = li.getAttribute('data-id');
        state.purchases = state.purchases.filter(function (p) { return p.id !== id; });
        save(state); render();
      };
    });
    document.getElementById('back').onclick = function () { screen = 'home'; render(); };
  }

  render();
  // Keep "this week" honest if the app stays open across Monday 8 AM.
  setInterval(function () { if (screen === 'home' && document.getElementById('modal').classList.contains('hidden')) render(); }, 60000);
})();
</script>
</body>
</html>
